<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - òtica Valentim</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a, #1b1a19, #3f3c3b);
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        
        .benefits-bar, .whatsapp-float, header, footer {
            display: none !important;
        }
        
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: #ffffff;
            border-radius: 40px;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .login-icon {
            width: 80px;
            height: 80px;
            background: #3a3939;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .login-icon i {
            font-size: 2.5rem;
            color: white;
        }
        
        .login-header h2 {
            font-size: 1.8rem;
            color: #414040;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666564;
            font-size: 0.9rem;
        }
        
        .login-field {
            margin-bottom: 25px;
        }
        
        .login-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #3E2723;
            font-size: 0.9rem;
        }
        
        .login-field label i {
            margin-right: 8px;
            color: #6D4C41;
        }
        
        .login-field input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #d4cdc9;
            border-radius: 16px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
            background: #ffffff;
        }
        
        .login-field input:focus {
            outline: none;
            border-color: #4E342E;
            box-shadow: 0 0 0 4px rgba(78, 52, 46, 0.15);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: #4E342E;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-login:hover {
            background: #3E2723;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0d6d3;
        }
        
        .login-footer a {
            color: #4E342E;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .login-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
        }
        
        .login-message.error {
            background: #fce4e4;
            color: #c62828;
            border: 1px solid #f5c6cb;
        }
        
        .login-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c3e6cb;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 25px;
            }
            .login-header h2 {
                font-size: 1.5rem;
            }
            .login-icon {
                width: 60px;
                height: 60px;
            }
            .login-icon i {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h2>🤎 Área Restrita</h2>
            <p>Faça login para acessar o painel administrativo</p>
        </div>
        
        <form id="loginForm">
            <div class="login-field">
                <label><i class="fas fa-user"></i> Usuário</label>
                <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="off" required>
            </div>
            
            <div class="login-field">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Entrar no Sistema
            </button>
        </form>
        
        <div id="mensagem" class="login-message" style="display: none;"></div>
        
        <div class="login-footer">
            <a href="/index.html"><i class="fas fa-arrow-left"></i> Voltar para a loja</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const mensagemDiv = document.getElementById('mensagem');
        
        mensagemDiv.style.display = 'none';
        mensagemDiv.className = 'login-message';
        
        if (!username || !password) {
            mensagemDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Preencha todos os campos';
            mensagemDiv.classList.add('error');
            mensagemDiv.style.display = 'block';
            return;
        }
        
        try {
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (data.success) {
                mensagemDiv.innerHTML = '<i class="fas fa-check-circle"></i> Login realizado! Redirecionando...';
                mensagemDiv.classList.add('success');
                mensagemDiv.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = '/admin/dashboard.html';
                }, 1500);
            } else {
                mensagemDiv.innerHTML = '<i class="fas fa-times-circle"></i> Usuário ou senha inválidos';
                mensagemDiv.classList.add('error');
                mensagemDiv.style.display = 'block';
            }
        } catch (error) {
            mensagemDiv.innerHTML = '<i class="fas fa-wifi"></i> Erro de conexão com o servidor';
            mensagemDiv.classList.add('error');
            mensagemDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
