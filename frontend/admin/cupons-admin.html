<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Cupons - Admin òtica Valentim</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* CORES CORRIGIDAS PARA ALTO CONTRASTE */
        .admin-nav {
            background: #2c1a15;
            padding: 15px 0;
            margin-bottom: 30px;
        }
        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-nav h3 {
            color: #ffffff !important;
        }
        .admin-nav a {
            color: #f0f0f0;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .admin-nav a:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .stats-cupons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card-cupom {
            background: #ffffff;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #3E2723;
        }
        
        .stat-card-cupom p {
            color: #5D4037;
            margin-top: 8px;
        }
        
        .table-container {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 20px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th {
            text-align: left;
            padding: 15px;
            background: #3E2723;
            color: #ffffff;
            font-weight: 600;
        }
        
        .data-table th:first-child {
            border-radius: 12px 0 0 0;
        }
        
        .data-table th:last-child {
            border-radius: 0 12px 0 0;
        }
        
        .data-table td {
            padding: 15px;
            border-bottom: 1px solid #e0d6d3;
            color: #2c2c2c;
        }
        
        .data-table tr:hover {
            background: #f5f0ed;
        }
        
        .badge-usado {
            background: #4CAF50;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }
        
        .badge-nao-usado {
            background: #FF9800;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
        }
        
        .btn-usar {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 0.7rem;
        }
        
        .btn-desusar {
            background: #FF9800;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 0.7rem;
        }
        
        .btn-excluir {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        
        .btn-usar:hover, .btn-desusar:hover, .btn-excluir:hover {
            filter: brightness(1.05);
        }
        
        .btn-gerar {
            background: #4E342E;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }
        
        .btn-gerar:hover {
            transform: translateY(-2px);
            background: #3E2723;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            max-width: 500px;
            width: 90%;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }
        
        .modal-content h3 {
            color: #3E2723;
            margin-bottom: 20px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #d4cdc9;
            border-radius: 12px;
            font-family: inherit;
            margin-top: 5px;
            background: #ffffff;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #4E342E;
            box-shadow: 0 0 0 3px rgba(78,52,46,0.15);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            color: #3E2723;
            margin-bottom: 5px;
        }
        
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #d4cdc9;
            border-radius: 12px;
            font-family: inherit;
            background: #ffffff;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #4E342E;
        }
        
        .search-box button {
            padding: 12px 24px;
            background: #4E342E;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        
        .search-box button:hover {
            background: #3E2723;
        }
        
        .codigo-cupom {
            font-family: monospace;
            font-size: 0.85rem;
            background: #f0ecea;
            padding: 4px 8px;
            border-radius: 6px;
            color: #3E2723;
        }
        
        .section-title {
            color: #3E2723;
            margin-bottom: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn {
            background: #4E342E;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .data-table th, .data-table td {
                padding: 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-nav">
        <div class="container">
            <h3 style="color: #ffffff;">🤎 Gerenciar Cupons</h3>
                <div class="nav-links">
                    <a href="/admin/dashboard.html">Dashboard</a>
                    <a href="/admin/produtos-admin.html">Produtos</a>
                    <a href="/admin/chat-admin.html">Chat</a>
                    <a href="/admin/cupons-admin.html">Cupons</a>
                    <a href="/admin/marcas-admin.html">Marcas</a>
                    <a href="/admin/chat-bot-admin.html">Bot</a>
                    <a href="/admin/notificacoes-admin.html">Notificações</a>
                    <a href="#" id="logoutBtn">Sair</a>
                </div>
        </div>
    </div>
    
    <div class="container">
        <h2 class="section-title">Gerenciamento de Cupons</h2>
        
        <div class="stats-cupons">
            <div class="stat-card-cupom">
                <i class="fas fa-ticket-alt" style="font-size: 2rem; color: #4E342E;"></i>
                <div class="stat-number" id="totalCupons">0</div>
                <p>Total de Cupons</p>
            </div>
            <div class="stat-card-cupom">
                <i class="fas fa-check-circle" style="font-size: 2rem; color: #4CAF50;"></i>
                <div class="stat-number" id="cuponsUsados">0</div>
                <p>Cupons Usados</p>
            </div>
            <div class="stat-card-cupom">
                <i class="fas fa-hourglass-half" style="font-size: 2rem; color: #FF9800;"></i>
                <div class="stat-number" id="cuponsNaoUsados">0</div>
                <p>Cupons Disponíveis</p>
            </div>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <button class="btn-gerar" id="btnGerarCupom">
                <i class="fas fa-plus-circle"></i> Gerar Novo Cupom
            </button>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar por código, cliente ou e-mail..." onkeyup="buscarCupons()">
                <button onclick="buscarCupons()"><i class="fas fa-search"></i> Buscar</button>
            </div>
        </div>
        
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Cliente</th>
                        <th>E-mail</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Data Criação</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaCupons">
                    <tr><td colspan="8" style="text-align: center; padding: 40px;">Carregando cupons...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div id="modalGerarCupom" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-ticket-alt"></i> Gerar Novo Cupom</h3>
            <form id="formGerarCupom">
                <div class="form-group">
                    <label>Cliente *</label>
                    <select id="clienteId" class="form-control" required>
                        <option value="">Selecione um cliente</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valor do Desconto (%)</label>
                    <input type="number" id="valorDesconto" class="form-control" value="10" min="1" max="50">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn" style="flex:1">Gerar Cupom</button>
                    <button type="button" class="btn" id="btnCancelarGerar" style="flex:1; background:#757575">Cancelar</button>
                </div>
            </form>
            <div id="gerarMensagem" style="margin-top: 15px;"></div>
        </div>
    </div>
    
    <script>
        let todosCupons = [];
        
        async function verificarLogin() {
            try {
                const response = await fetch('/api/admin/check');
                const data = await response.json();
                if (!data.isAdmin) {
                    window.location.href = '/admin/login.html';
                }
            } catch (error) {
                window.location.href = '/admin/login.html';
            }
        }
        
        async function carregarEstatisticas() {
            try {
                const response = await fetch('/api/admin/cupons/stats');
                const stats = await response.json();
                document.getElementById('totalCupons').textContent = stats.total || 0;
                document.getElementById('cuponsUsados').textContent = stats.usados || 0;
                document.getElementById('cuponsNaoUsados').textContent = stats.nao_usados || 0;
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        async function carregarCupons() {
            try {
                const response = await fetch('/api/admin/cupons');
                todosCupons = await response.json();
                exibirCupons(todosCupons);
                carregarEstatisticas();
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('listaCupons').innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">❌ Erro ao carregar cupons</td></tr>';
            }
        }
        
        function exibirCupons(cupons) {
            const tbody = document.getElementById('listaCupons');
            
            if (!cupons || cupons.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">📭 Nenhum cupom encontrado</td></tr>';
                return;
            }
            
            tbody.innerHTML = cupons.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td><code class="codigo-cupom">${c.codigo}</code></td>
                    <td><strong>${c.cliente_nome || '-'}</strong></td>
                    <td>${c.cliente_email || '-'}</td>
                    <td>${c.valor}% OFF</td>
                    <td>${c.usado === 1 ? '<span class="badge-usado">Usado</span>' : '<span class="badge-nao-usado">Disponível</span>'}</td>
                    <td>${new Date(c.created_at).toLocaleDateString('pt-BR')}</td>
                    <td>
                        ${c.usado === 0 ? `<button class="btn-usar" onclick="marcarComoUsado(${c.id})"><i class="fas fa-check"></i> Usar</button>` : `<button class="btn-desusar" onclick="marcarComoNaoUsado(${c.id})"><i class="fas fa-undo"></i> Reverter</button>`}
                        <button class="btn-excluir" onclick="excluirCupom(${c.id})"><i class="fas fa-trash"></i> Excluir</button>
                     </td>
                 </tr>
            `).join('');
        }
        
        function buscarCupons() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            if (!termo) {
                exibirCupons(todosCupons);
                return;
            }
            
            const filtrados = todosCupons.filter(c => 
                c.codigo.toLowerCase().includes(termo) ||
                (c.cliente_nome && c.cliente_nome.toLowerCase().includes(termo)) ||
                (c.cliente_email && c.cliente_email.toLowerCase().includes(termo))
            );
            exibirCupons(filtrados);
        }
        
        async function marcarComoUsado(id) {
            if (confirm('✅ Marcar este cupom como usado?')) {
                try {
                    const response = await fetch(`/api/admin/cupons/usar/${id}`, { method: 'PUT' });
                    if (response.ok) {
                        alert('✅ Cupom marcado como usado!');
                        carregarCupons();
                    } else {
                        alert('❌ Erro ao marcar cupom');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }
        
        async function marcarComoNaoUsado(id) {
            if (confirm('🔄 Reverter este cupom para disponível?')) {
                try {
                    const response = await fetch(`/api/admin/cupons/desusar/${id}`, { method: 'PUT' });
                    if (response.ok) {
                        alert('✅ Cupom revertido com sucesso!');
                        carregarCupons();
                    } else {
                        alert('❌ Erro ao reverter cupom');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }
        
        async function excluirCupom(id) {
            if (confirm('⚠️ Tem certeza que deseja excluir este cupom?')) {
                try {
                    const response = await fetch(`/api/admin/cupons/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        alert('✅ Cupom excluído!');
                        carregarCupons();
                    } else {
                        alert('❌ Erro ao excluir cupom');
                    }
                } catch (error) {
                    alert('❌ Erro de conexão');
                }
            }
        }
        
        async function carregarClientesSelect() {
            try {
                const response = await fetch('/api/admin/clientes');
                const clientes = await response.json();
                const select = document.getElementById('clienteId');
                select.innerHTML = '<option value="">Selecione um cliente</option>' + 
                    clientes.map(c => `<option value="${c.id}">${c.nome} - ${c.email}</option>`).join('');
            } catch (error) {
                console.error('Erro:', error);
            }
        }
        
        document.getElementById('formGerarCupom').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cliente_id = document.getElementById('clienteId').value;
            const valor = document.getElementById('valorDesconto').value;
            
            if (!cliente_id) {
                alert('⚠️ Selecione um cliente');
                return;
            }
            
            const btnSubmit = document.querySelector('#formGerarCupom button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<span class="spinner"></span> Gerando...';
            btnSubmit.disabled = true;
            
            try {
                const response = await fetch('/api/admin/cupons/gerar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cliente_id, valor: parseInt(valor) })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert(`✅ Cupom gerado: ${result.codigo}`);
                    document.getElementById('modalGerarCupom').style.display = 'none';
                    carregarCupons();
                } else {
                    alert('❌ Erro: ' + result.error);
                }
            } catch (error) {
                alert('❌ Erro de conexão');
            } finally {
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
            }
        });
        
        document.getElementById('btnGerarCupom').onclick = () => {
            carregarClientesSelect();
            document.getElementById('modalGerarCupom').style.display = 'flex';
        };
        
        document.getElementById('btnCancelarGerar').onclick = () => {
            document.getElementById('modalGerarCupom').style.display = 'none';
        };
        
        document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/admin/logout', { method: 'POST' });
            window.location.href = '/admin/login.html';
        });
        
        verificarLogin();
        carregarCupons();
        setInterval(carregarCupons, 30000);
    </script>
</body>
</html>
