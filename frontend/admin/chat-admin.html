<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat - Ótica Valentim</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Estilos específicos do admin - Paleta preto/cinza/branco */
        .admin-nav {
            background: #1a1a1a;
            padding: 15px 0;
            margin-bottom: 30px;
        }
        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-nav h3 {
            color: #ffffff !important;
            margin: 0;
        }
        .admin-nav a {
            color: #f0f0f0;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .admin-nav a:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .chat-admin-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            min-height: 600px;
        }
        
        .chat-admin-sidebar {
            background: #ffffff;
            border-radius: 20px;
            overflow-y: auto;
            max-height: 650px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .chat-admin-main {
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .conversa-item {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .conversa-item:hover {
            background: #f5f5f5;
        }
        
        .conversa-item.selecionada {
            background: #e8e8e8;
            border-left: 4px solid #1a1a1a;
        }
        
        .conversa-nome {
            font-weight: 600;
            color: #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .conversa-email {
            font-size: 0.75rem;
            color: #666;
            margin-top: 4px;
        }
        
        .status-aberto {
            background: #4CAF50;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            display: inline-block;
        }
        .status-fechado {
            background: #9E9E9E;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            display: inline-block;
        }
        .status-fechado_cliente {
            background: #FF9800;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            display: inline-block;
        }
        
        .nao-lidas {
            background: #d32f2f;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .chat-messages {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }
        
        .chat-input-area {
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #cccccc;
            border-radius: 25px;
            font-family: inherit;
        }
        
        .chat-input-area input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        
        .chat-header-info {
            padding: 15px 20px;
            background: #1a1a1a;
            color: white;
            border-radius: 20px 20px 0 0;
        }
        
        .chat-header-info h3 {
            color: white;
            margin: 0;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .message.cliente .message-bubble {
            background: #e8e8e8;
            color: #1a1a1a;
            align-self: flex-start;
            border-radius: 20px 20px 20px 5px;
        }
        
        .message.admin .message-bubble {
            background: #1a1a1a;
            color: white;
            align-self: flex-end;
            border-radius: 20px 20px 5px 20px;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 20px;
            word-wrap: break-word;
        }
        
        .message-time {
            font-size: 0.7rem;
            color: #888;
            margin-top: 5px;
        }
        
        .bot-badge {
            background: #FFC107;
            color: #1a1a1a;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
        
        .btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn:hover {
            background: #0a0a0a;
        }
        
        .section-title {
            color: #1a1a1a;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .chat-admin-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-nav">
        <div class="container">
            <h3>🕶️ Painel Admin - Ótica Valentim</h3>
            <div class="nav-links">
                <a href="/admin/dashboard.html">Dashboard</a>
                <a href="/admin/produtos-admin.html">Produtos</a>
                <a href="/admin/chat-admin.html">Chat</a>
                <a href="/admin/cupons-admin.html">Cupons</a>
                <a href="/admin/marcas-admin.html">Marcas</a>
                <a href="/admin/chat-bot-admin.html">Bot</a>
                <a href="/admin/notificacoes-admin.html">Notificações</a>
                <a href="#" id="logoutBtn">Sair</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 class="section-title">Atendimento ao Cliente</h2>
        
        <div class="chat-admin-layout">
            <div class="chat-admin-sidebar">
                <div style="padding: 15px; background: #1a1a1a; color: white; border-radius: 20px 20px 0 0; font-weight: 600;">
                    <i class="fas fa-comments"></i> Conversas Ativas
                </div>
                <div id="listaConversas">
                    <div class="loading">Carregando conversas...</div>
                </div>
            </div>
            
            <div class="chat-admin-main">
                <div id="semChatSelecionado" style="text-align: center; padding: 100px; color: #666;">
                    <i class="fas fa-comment-dots" style="font-size: 4rem;"></i>
                    <p style="margin-top: 15px;">Selecione uma conversa na lista ao lado</p>
                    <p style="font-size: 0.8rem;">Clique em qualquer conversa para visualizar e responder</p>
                </div>
                
                <div id="chatArea" style="display: none; flex-direction: column; height: 100%;">
                    <div id="chatHeader" class="chat-header-info">
                        <h3 id="chatClienteNome">Carregando...</h3>
                        <p id="chatClienteInfo" style="font-size: 0.8rem; opacity: 0.9; margin-top: 5px;"></p>
                    </div>
                    <div class="chat-messages" id="adminChatMessages">
                        <div class="loading">Carregando mensagens...</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="adminMensagemInput" placeholder="Digite sua resposta...">
                        <button class="btn" onclick="enviarMensagemAdmin()">Enviar</button>
                        <button class="btn" id="fecharConversaBtn" style="background: #757575;">Fechar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let conversas = [];
        let conversaSelecionada = null;
        let pollingInterval = null;

        async function verificarLogin() {
            try {
                const response = await fetch('/api/admin/check');
                const data = await response.json();
                if (!data.isAdmin) window.location.href = '/admin/login.html';
            } catch (error) {
                window.location.href = '/admin/login.html';
            }
        }

        async function carregarConversas() {
            try {
                const response = await fetch('/api/admin/conversas');
                conversas = await response.json();
                const container = document.getElementById('listaConversas');
                
                if (!conversas || conversas.length === 0) {
                    container.innerHTML = '<div style="padding: 40px; text-align: center;"><i class="fas fa-inbox"></i><p style="margin-top: 10px;">Nenhuma conversa ainda</p></div>';
                    return;
                }
                
                container.innerHTML = conversas.map(conv => `
                    <div class="conversa-item ${conversaSelecionada === conv.id ? 'selecionada' : ''}" onclick="selecionarConversa(${conv.id})">
                        <div class="conversa-nome">
                            <span>${escapeHtml(conv.cliente_nome || 'Cliente')}</span>
                            ${conv.nao_lidas > 0 ? `<span class="nao-lidas">${conv.nao_lidas}</span>` : ''}
                        </div>
                        <div class="conversa-email">${escapeHtml(conv.cliente_email || 'Sem email')}</div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <span class="status-${conv.status}">${getStatusText(conv.status)}</span>
                            <span style="font-size: 0.65rem; color: #666;">${formatarData(conv.ultima_atualizacao)}</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                document.getElementById('listaConversas').innerHTML = '<div style="padding: 40px; text-align: center;">Erro ao carregar</div>';
            }
        }

        function formatarData(data) {
            if (!data) return '';
            const date = new Date(data);
            const hoje = new Date();
            const diff = hoje - date;
            const minutos = Math.floor(diff / 60000);
            if (minutos < 1) return 'agora';
            if (minutos < 60) return `${minutos} min`;
            if (minutos < 1440) return `${Math.floor(minutos / 60)} h`;
            return date.toLocaleDateString('pt-BR');
        }

        function getStatusText(status) {
            switch(status) {
                case 'aberto': return '🟢 Aberto';
                case 'fechado': return '🔴 Fechado';
                case 'fechado_cliente': return '🟠 Cliente fechou';
                default: return status;
            }
        }

        async function selecionarConversa(id) {
            conversaSelecionada = id;
            const conversa = conversas.find(c => c.id === id);
            
            if (conversa) {
                document.getElementById('chatClienteNome').textContent = conversa.cliente_nome || 'Cliente';
                document.getElementById('chatClienteInfo').innerHTML = `📧 ${conversa.cliente_email || 'Sem email'} | 📱 ${conversa.cliente_telefone || 'Sem telefone'} | Status: ${getStatusText(conversa.status)}`;
            }
            
            document.getElementById('semChatSelecionado').style.display = 'none';
            document.getElementById('chatArea').style.display = 'flex';
            
            await carregarMensagensAdmin(id);
            await marcarComoLidas(id);
            
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => {
                if (conversaSelecionada) carregarMensagensAdmin(conversaSelecionada);
            }, 5000);
            
            carregarConversas();
        }

        async function carregarMensagensAdmin(conversaId) {
            if (!conversaId) return;
            try {
                const response = await fetch(`/api/chat/mensagens/${conversaId}`);
                const mensagens = await response.json();
                const container = document.getElementById('adminChatMessages');
                
                if (!mensagens || mensagens.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 40px;">Nenhuma mensagem ainda</div>';
                    return;
                }
                
                container.innerHTML = mensagens.map(msg => `
                    <div class="message ${msg.remetente === 'cliente' ? 'cliente' : 'admin'}">
                        <div class="message-bubble">
                            ${escapeHtml(msg.mensagem)}
                            ${msg.remetente === 'admin' ? '<span class="bot-badge">Admin</span>' : ''}
                        </div>
                        <div class="message-time">${new Date(msg.created_at).toLocaleString()}</div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error(error);
            }
        }

        async function marcarComoLidas(conversaId) {
            try {
                await fetch(`/api/admin/marcar-lidas/${conversaId}`, { method: 'POST' });
            } catch (error) { console.error(error); }
        }

        async function enviarMensagemAdmin() {
            const input = document.getElementById('adminMensagemInput');
            const mensagem = input.value.trim();
            if (!mensagem || !conversaSelecionada) return;
            
            const conversa = conversas.find(c => c.id === conversaSelecionada);
            if (conversa && conversa.status !== 'aberto') {
                alert('⚠️ Esta conversa está encerrada. Não é possível enviar mensagens.');
                return;
            }
            
            try {
                const response = await fetch('/api/admin/enviar-mensagem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conversa_id: conversaSelecionada, mensagem })
                });
                
                if (response.ok) {
                    input.value = '';
                    await carregarMensagensAdmin(conversaSelecionada);
                    await carregarConversas();
                } else {
                    alert('❌ Erro ao enviar mensagem');
                }
            } catch (error) { 
                alert('❌ Erro de conexão'); 
            }
        }

        async function fecharConversa() {
            if (!conversaSelecionada) return;
            const conversa = conversas.find(c => c.id === conversaSelecionada);
            if (conversa && conversa.status !== 'aberto') {
                alert('⚠️ Esta conversa já está encerrada.');
                return;
            }
            
            if (confirm('⚠️ Deseja encerrar esta conversa?')) {
                try {
                    await fetch(`/api/admin/fechar-conversa/${conversaSelecionada}`, { method: 'POST' });
                    alert('✅ Conversa encerrada!');
                    await carregarConversas();
                    document.getElementById('semChatSelecionado').style.display = 'flex';
                    document.getElementById('chatArea').style.display = 'none';
                    conversaSelecionada = null;
                    if (pollingInterval) clearInterval(pollingInterval);
                } catch (error) { 
                    alert('❌ Erro ao encerrar'); 
                }
            }
        }

        document.getElementById('fecharConversaBtn').addEventListener('click', fecharConversa);
        document.getElementById('adminMensagemInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensagemAdmin();
        });
        
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('/api/admin/logout', { method: 'POST' });
            window.location.href = '/admin/login.html';
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        verificarLogin();
        carregarConversas();
        setInterval(carregarConversas, 10000);
    </script>
</body>
</html>
